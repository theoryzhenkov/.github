# .github/workflows/deploy-docker.yml
name: deploy-docker

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      dockerfile_path:
        required: false
        type: string
        default: './Dockerfile'
      build_context:
        required: false
        type: string
        default: '.'
    secrets:
      TARS_APP_UPDATE_WEBHOOK_SECRET:
        required: false
        description: 'HMAC secret for the tars app-update webhook; when set, tars redeploys the app seconds after the push instead of on the polling fallback.'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ inputs.app_name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ inputs.app_name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/${{ inputs.app_name }}:buildcache,mode=max

      - name: Image pushed
        run: |
          echo "✔ Image pushed to ghcr.io/${{ github.repository }}/${{ inputs.app_name }}:latest"

      - name: Trigger tars app update
        env:
          TARS_WEBHOOK_SECRET: ${{ secrets.TARS_APP_UPDATE_WEBHOOK_SECRET }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          if [ -z "$TARS_WEBHOOK_SECRET" ]; then
            echo "TARS_APP_UPDATE_WEBHOOK_SECRET not provided; skipping tars trigger"
            exit 0
          fi
          ts=$(date +%s)000
          body="{\"app\":\"$APP_NAME\"}"
          sig=$(printf '%s%s' "$body" "$ts" | openssl dgst -sha256 -hmac "$TARS_WEBHOOK_SECRET" -r | cut -d' ' -f1)
          curl -fsS -X POST https://theor.net/.theor/app-update \
            -H "X-Update-Signature: sha256=$sig,t=$ts" \
            -H 'Content-Type: application/json' -d "$body"
